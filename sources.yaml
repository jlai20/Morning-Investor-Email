newsletters:

  # Michael Burry — Cassandra Unchained. AI bubble thesis, contrarian macro.
  # Most posts are paywalled ($379/yr). We scrape free previews and notes.
  - name: "Michael Burry (Cassandra Unchained)"
    type: scrape
    url: "https://michaeljburry.substack.com/"

  # Citrini Research — #1 Finance on Substack (212K subscribers).
  # Thematic equity + global macro. Featured in Bloomberg and The Economist.
  - name: "Citrini Research"
    type: scrape
    url: "https://www.citriniresearch.com/"

  # Doomberg — #3 Finance on Substack (380K subscribers).
  # Energy, commodities, geopolitics. Contrarian and lateral thinking.
  - name: "Doomberg"
    type: scrape
    url: "https://newsletter.doomberg.com/"

  # Global Macro Investor — Raoul Pal. Institutional-level macro framework.
  # Rates, FX, equities, commodities, crypto cycles.
  - name: "Global Macro Investor (Raoul Pal)"
    type: scrape
    url: "https://raoulpal.substack.com/"

  # Net Interest — Marc Rubinstein. 25yr hedge fund veteran.
  # Deep financial sector analysis. Cited in FT, Bloomberg, UK Parliament.
  - name: "Net Interest (Marc Rubinstein)"
    type: scrape
    url: "https://www.netinterest.co/"

